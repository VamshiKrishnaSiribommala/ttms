services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tms-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Password123}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql/data
      - ./Database:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Password123}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Password123}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tms-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./Database:/var/opt/mssql/backup
    entrypoint: >
      /bin/bash -c "
      echo 'Waiting for SQL Server to be fully ready...';
      sleep 2;
      echo 'Applying database restorations and schema migrations...';
      if [ -f /opt/mssql-tools18/bin/sqlcmd ]; then
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Password123}\" -C -i /var/opt/mssql/backup/restore-databases.sql;
      else
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Password123}\" -C -i /var/opt/mssql/backup/restore-databases.sql;
      fi;
      echo 'Database initialization complete!';
      "

volumes:
  mssql-data:
